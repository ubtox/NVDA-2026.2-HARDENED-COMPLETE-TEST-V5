name: One-shot port Python 3.13.15 to Evolution

on:
  push:
    branches:
      - 'evolution/2026.2-next'
    paths:
      - '.github/workflows/port-python-31315-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Enable Windows Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout exact Evolution branch
        uses: actions/checkout@v6
        with:
          ref: evolution/2026.2-next
          fetch-depth: 0

      - name: Audit and align Python pins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mutable = @(
            '.github/workflows/evolution-validation.yml',
            '.github/workflows/lab-validation.yml',
            'LAB-BUILD.ps1',
            'README.md',
            'NVDA-2026.2-HARDENED-SOURCE-V5/.github/workflows/add-new-language.yml',
            'NVDA-2026.2-HARDENED-SOURCE-V5/.github/workflows/fetch-crowdin-translations.yml',
            'NVDA-2026.2-HARDENED-SOURCE-V5/.github/workflows/testAndPublish.yml',
            'NVDA-2026.2-HARDENED-SOURCE-V5/.python-versions',
            'NVDA-2026.2-HARDENED-SOURCE-V5/projectDocs/dev/createDevEnvironment.md',
            'NVDA-2026.2-HARDENED-SOURCE-V5/runtime-builders/synthDriverHost32/.python-version'
          )
          $allowedLegacy = @(
            '.github/workflows/port-python-31315-once.yml',
            '.github/workflows/rc2-upstream-hardening.yml'
          )

          $matches = @(git grep -l --fixed-strings '3.13.13' -- ':!VALIDATION-RUNS/**' ':!PATCH-BACKUP-*/**')
          if ($LASTEXITCODE -notin @(0, 1)) { throw "git grep failed: $LASTEXITCODE" }
          Write-Host 'Tracked Python 3.13.13 references:'
          $matches | ForEach-Object { Write-Host "  $_" }

          $unexpected = @($matches | Where-Object {
            $_ -notin $mutable -and
            $_ -notin $allowedLegacy -and
            $_ -notlike 'NVDA-2026.2-HARDENED-SOURCE-V5/miscDeps/*' -and
            $_ -notlike 'NVDA-2026.2-HARDENED-SOURCE-V5/user_docs/*'
          })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected Python 3.13.13 references require audit: $($unexpected -join ', ')"
          }

          foreach ($path in $mutable) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required Python pin file is missing: $path"
            }
            $text = [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath $path))
            $count = ([regex]::Matches($text, [regex]::Escape('3.13.13'))).Count
            if ($count -lt 1) {
              throw "Expected a Python 3.13.13 pin in $path"
            }
            $text = $text.Replace('3.13.13', '3.13.15')
            [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $path), $text, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Updated $path ($count occurrence(s))"
          }

          $docPath = 'EVOLUTION-2026.2-NEXT.md'
          $doc = [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath $docPath))
          $anchor = '- Quantitative performance baselines and trend comparison remain planned.'
          if (($doc.Split($anchor).Count - 1) -ne 1) {
            throw 'Evolution Track 6 documentation anchor was not unique.'
          }
          $replacement = @"
          - NV Access Python 3.13.15 toolchain update (#20634) ported across the Evolution runtime, x86 synth-host builder, upstream CI pins and LAB validation; the frozen RC2 one-shot workflow intentionally retains its original 3.13.13 pin.
          $anchor
          "@.Trim()
          $doc = $doc.Replace($anchor, $replacement)
          [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $docPath), $doc, [System.Text.UTF8Encoding]::new($false))

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed: $LASTEXITCODE" }

          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          $expected = @($mutable + $docPath) | Sort-Object
          $actual = @($changed | Sort-Object)
          if (($actual -join "`n") -ne ($expected -join "`n")) {
            throw "Unexpected changed files: $($actual -join ', ')"
          }

      - name: Commit exact Python port
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'EVOLUTION-2026.2-NEXT.md' '.github/workflows/evolution-validation.yml' '.github/workflows/lab-validation.yml' 'LAB-BUILD.ps1' 'README.md' 'NVDA-2026.2-HARDENED-SOURCE-V5/.github/workflows/add-new-language.yml' 'NVDA-2026.2-HARDENED-SOURCE-V5/.github/workflows/fetch-crowdin-translations.yml' 'NVDA-2026.2-HARDENED-SOURCE-V5/.github/workflows/testAndPublish.yml' 'NVDA-2026.2-HARDENED-SOURCE-V5/.python-versions' 'NVDA-2026.2-HARDENED-SOURCE-V5/projectDocs/dev/createDevEnvironment.md' 'NVDA-2026.2-HARDENED-SOURCE-V5/runtime-builders/synthDriverHost32/.python-version'
          git commit -m 'Build: port Python 3.13.15 from NV Access #20634'
          if ($LASTEXITCODE -ne 0) { throw "git commit failed: $LASTEXITCODE" }
          git push origin 'HEAD:evolution/2026.2-next'
          if ($LASTEXITCODE -ne 0) { throw "git push failed: $LASTEXITCODE" }
