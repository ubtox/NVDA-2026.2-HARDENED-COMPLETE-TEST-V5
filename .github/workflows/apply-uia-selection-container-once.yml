name: One-shot UIA SelectionContainer hardening

on:
  push:
    branches:
      - 'evolution/2026.2-uia-selection-container'
    paths:
      - '.github/workflows/apply-uia-selection-container-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Enable Windows Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout staging branch
        uses: actions/checkout@v6
        with:
          ref: evolution/2026.2-uia-selection-container
          fetch-depth: 0

      - name: Install CPython 3.13.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
          architecture: x64
          update-environment: true

      - name: Install CPython 3.13.13 x86 helper
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
          architecture: x86
          update-environment: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: cpython-3.13.13-windows-x86_64-none

      - name: Apply exact source and test changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          source = Path(r"NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py")
          tests = Path(r"NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_UIAHandler.py")

          source_text = source.read_text(encoding="utf-8")
          old = "\t\te = p.currentSelectionContainer\n"
          new = (
              "\t\ttry:\n"
              "\t\t\te = p.currentSelectionContainer\n"
              "\t\texcept COMError:\n"
              "\t\t\t# Some providers (e.g. Qt's QWindowsUiaSelectionItemProvider when the\n"
              "\t\t\t# accessible has no actionInterface) raise instead of returning a value.\n"
              "\t\t\t# Treat the same as no selection container so focus speech is not aborted.\n"
              "\t\t\treturn None\n"
          )
          if source_text.count(old) != 1:
              raise SystemExit(f"Expected exactly one SelectionContainer source anchor, found {source_text.count(old)}")
          source.write_text(source_text.replace(old, new, 1), encoding="utf-8", newline="\n")

          test_text = tests.read_text(encoding="utf-8")
          anchor = "class TestUIATextAttributeNormalization(TestCase):\n"
          addition = (
              "class TestUIASelectionContainer(TestCase):\n"
              "\tdef test_COMErrorIsTreatedAsNoSelectionContainer(self):\n"
              "\t\tclass FailingSelectionItemPattern:\n"
              "\t\t\t@property\n"
              "\t\t\tdef currentSelectionContainer(self):\n"
              "\t\t\t\traise COMError(-1, \"failure\", None)\n\n"
              "\t\tuiObject = Mock()\n"
              "\t\tuiObject.UIASelectionItemPattern = FailingSelectionItemPattern()\n\n"
              "\t\tself.assertIsNone(UIA._get_selectionContainer(uiObject))\n\n\n"
          )
          if test_text.count(anchor) != 1:
              raise SystemExit(f"Expected exactly one unit-test insertion anchor, found {test_text.count(anchor)}")
          if "class TestUIASelectionContainer" in test_text:
              raise SystemExit("SelectionContainer test already exists")
          tests.write_text(test_text.replace(anchor, addition + anchor, 1), encoding="utf-8", newline="\n")
          '@ | Set-Content -LiteralPath .apply-uia-selection-container.py -Encoding utf8

          python .apply-uia-selection-container.py
          Remove-Item -LiteralPath .apply-uia-selection-container.py -Force

          $expected = @(
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_UIAHandler.py'
          )
          $changed = @(git diff --name-only)
          if ($changed.Count -ne $expected.Count) {
            throw "Unexpected changed-file count before validation: $($changed -join ', ')"
          }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) { throw "Expected changed file missing: $path" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed: $LASTEXITCODE" }

      - name: Validate formatting and source build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Join-Path $PWD 'NVDA-2026.2-HARDENED-SOURCE-V5'
          $files = @(
            (Join-Path $sourceRoot 'source\NVDAObjects\UIA\__init__.py'),
            (Join-Path $sourceRoot 'tests\unit\test_UIAHandler.py')
          )
          uvx --from ruff==0.15.9 ruff check @files
          if ($LASTEXITCODE -ne 0) { throw "Ruff check failed: $LASTEXITCODE" }
          uvx --from ruff==0.15.9 ruff format --check @files
          if ($LASTEXITCODE -ne 0) { throw "Ruff format check failed: $LASTEXITCODE" }

          & .\LAB-BUILD.ps1 -Mode Source -Parallel -SkipQuality
          if ($LASTEXITCODE -ne 0) { throw "Source build/unit validation failed: $LASTEXITCODE" }

      - name: Commit validated change and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm -- '.github/workflows/apply-uia-selection-container-once.yml'
          $expected = @(
            '.github/workflows/apply-uia-selection-container-once.yml',
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_UIAHandler.py'
          )
          $changed = @(git diff --name-only HEAD)
          if ($changed.Count -ne $expected.Count) {
            throw "Unexpected final changed-file count: $($changed -join ', ')"
          }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) { throw "Expected final changed file missing: $path" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Final git diff --check failed: $LASTEXITCODE" }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'UIA: tolerate SelectionContainer provider failures'
          if ($LASTEXITCODE -ne 0) { throw "git commit failed: $LASTEXITCODE" }
          git push origin 'HEAD:evolution/2026.2-uia-selection-container'
          if ($LASTEXITCODE -ne 0) { throw "git push failed: $LASTEXITCODE" }
