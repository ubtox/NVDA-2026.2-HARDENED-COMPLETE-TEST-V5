name: One-shot exact TreeInterceptor security port

on:
  push:
    branches:
      - 'evolution/2026.2-next'
    paths:
      - '.github/workflows/port-security-treeinterceptor-once.yml'

permissions:
  contents: write

jobs:
  port:
    name: Port verified upstream security blobs
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Enable Windows Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout Evolution branch
        uses: actions/checkout@v6
        with:
          ref: evolution/2026.2-next
          fetch-depth: 0

      - name: Replace security source and tests with verified upstream blobs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'NVDA-2026.2-HARDENED-SOURCE-V5/source/utils/security.py'
          $tests = 'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_util/test_security.py'
          $expectedSourceBefore = 'b0c9acf1f8fc478a1101369336b4584346d7a389'
          $expectedTestsBefore = '7830b295ee4c8901568f5b306cd12ae4c3c1ec98'
          $upstreamCommit = 'bfd0505e9cba8b40d33904a03efe462011eb1ab0'
          $expectedSourceAfter = '90feedb092859b7decb2fd126c07ab1f512b4c82'
          $expectedTestsAfter = '94b86ad0beaecaa7a310805e3116e1db831244fb'

          $sourceBefore = (git hash-object -- $source).Trim()
          $testsBefore = (git hash-object -- $tests).Trim()
          if ($sourceBefore -ne $expectedSourceBefore) {
            throw "Unexpected security.py blob before port: $sourceBefore"
          }
          if ($testsBefore -ne $expectedTestsBefore) {
            throw "Unexpected test_security.py blob before port: $testsBefore"
          }

          git remote remove nvaccess 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          git remote add nvaccess https://github.com/nvaccess/nvda.git
          git fetch --no-tags --depth=1 nvaccess $upstreamCommit
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch verified NV Access commit.' }

          $upstreamSourceSpec = "${upstreamCommit}:source/utils/security.py"
          $upstreamTestsSpec = "${upstreamCommit}:tests/unit/test_util/test_security.py"
          $sourceBlob = (git rev-parse $upstreamSourceSpec).Trim()
          $testsBlob = (git rev-parse $upstreamTestsSpec).Trim()
          if ($sourceBlob -ne $expectedSourceAfter) {
            throw "Unexpected upstream security.py blob: $sourceBlob"
          }
          if ($testsBlob -ne $expectedTestsAfter) {
            throw "Unexpected upstream test_security.py blob: $testsBlob"
          }

          git update-index --add --cacheinfo 100644 $sourceBlob $source
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage verified security.py blob.' }
          git update-index --add --cacheinfo 100644 $testsBlob $tests
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage verified test_security.py blob.' }
          git checkout-index -f -- $source $tests
          if ($LASTEXITCODE -ne 0) { throw 'Unable to materialize verified security blobs.' }

          $sourceAfter = (git hash-object -- $source).Trim()
          $testsAfter = (git hash-object -- $tests).Trim()
          if ($sourceAfter -ne $expectedSourceAfter) {
            throw "Materialized security.py does not match verified upstream blob: $sourceAfter"
          }
          if ($testsAfter -ne $expectedTestsAfter) {
            throw "Materialized test_security.py does not match verified upstream blob: $testsAfter"
          }

          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed for TreeInterceptor security port.' }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Security: port TreeInterceptor lock-screen boundary hardening'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit TreeInterceptor security port.' }
          git push origin HEAD:evolution/2026.2-next
          if ($LASTEXITCODE -ne 0) { throw 'Unable to push TreeInterceptor security port.' }

          Write-Host "Verified security port complete."
