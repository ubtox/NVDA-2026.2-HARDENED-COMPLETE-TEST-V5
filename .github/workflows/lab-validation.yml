name: NVDA LAB validation

on:
  push:
    branches:
      - main
      - 'rc/**'
    paths-ignore:
      - 'VALIDATION-RUNS/**'
      - 'PATCH-BACKUP-*/**'
  workflow_dispatch:
    inputs:
      buildMode:
        description: LAB build mode
        required: true
        default: All
        type: choice
        options:
          - Source
          - All

permissions:
  contents: read

concurrency:
  group: nvda-lab-all-${{ github.ref }}
  cancel-in-progress: true

env:
  VSCMD_SKIP_SENDTELEMETRY: 1
  SCONS_CACHE_MSVC_CONFIG: '.scons_msvc_cache.json'

jobs:
  validate:
    name: Validate NVDA 2026.2 LAB
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Enable Windows Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout LAB source only
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            NVDA-2026.2-HARDENED-SOURCE-V5
            LAB-BUILD.ps1
            LAB-RUN.ps1
            README.md
            .gitignore
          sparse-checkout-cone-mode: false

      - name: Install CPython 3.13.15 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          architecture: x64
          update-environment: true

      - name: Install CPython 3.13.15 x86 helper
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          architecture: x86
          update-environment: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: cpython-3.13.15-windows-x86_64-none

      - name: Resolve build mode
        id: mode
        shell: pwsh
        run: |
          $mode = '${{ github.event.inputs.buildMode }}'
          if ([string]::IsNullOrWhiteSpace($mode)) {
            $mode = 'All'
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT

      - name: Run LAB validation
        shell: pwsh
        run: |
          $logRoot = Join-Path $PWD 'LAB-LOCAL-OUTPUT'
          New-Item -ItemType Directory -Force -Path $logRoot | Out-Null
          $workflowLog = Join-Path $logRoot 'LAB-WORKFLOW-COMPLETE.log'
          try {
            & .\LAB-BUILD.ps1 -Mode '${{ steps.mode.outputs.mode }}' -Parallel *>&1 |
              Tee-Object -FilePath $workflowLog
          } catch {
            $_ | Out-String |
              Tee-Object -FilePath $workflowLog -Append |
              Write-Host
            throw
          }

      - name: Build true RC-labelled distribution and installer
        if: ${{ success() && steps.mode.outputs.mode == 'All' }}
        shell: pwsh
        run: |
          $sourceRoot = Join-Path $PWD 'NVDA-2026.2-HARDENED-SOURCE-V5'
          Set-Location $sourceRoot

          foreach ($relative in @('output', 'dist')) {
            $path = Join-Path $sourceRoot $relative
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }

          $sconsArgs = @(
            'dist',
            'launcher',
            'version=2026.2rc2',
            'release=1',
            'updateVersionType=rc',
            'publisher=NVDA Hardened LAB',
            'version_build=${{ github.run_number }}',
            '--all-cores'
          )
          & uv run scons @sconsArgs
          if ($LASTEXITCODE -ne 0) {
            throw "RC SCons build failed with exit code $LASTEXITCODE"
          }

          $expectedInstaller = Join-Path $sourceRoot 'output\nvda_2026.2rc2.exe'
          if (-not (Test-Path -LiteralPath $expectedInstaller -PathType Leaf)) {
            throw "Expected RC installer was not produced: $expectedInstaller"
          }
          Write-Host "RC installer produced: $expectedInstaller" -ForegroundColor Green

      - name: Verify RC executables and SHA-256
        if: ${{ success() && steps.mode.outputs.mode == 'All' }}
        shell: pwsh
        run: |
          $sourceRoot = Join-Path $PWD 'NVDA-2026.2-HARDENED-SOURCE-V5'
          $installer = Join-Path $sourceRoot 'output\nvda_2026.2rc2.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw 'RC validation failed: nvda_2026.2rc2.exe is missing.'
          }

          $exeFiles = @()
          foreach ($relativeRoot in @('output', 'dist')) {
            $root = Join-Path $sourceRoot $relativeRoot
            if (Test-Path -LiteralPath $root) {
              $exeFiles += Get-ChildItem -LiteralPath $root -Filter '*.exe' -File -Recurse -ErrorAction Stop
            }
          }
          $exeFiles = @($exeFiles | Sort-Object FullName -Unique)
          if ($exeFiles.Count -eq 0) {
            throw 'RC validation failed: no executable was produced.'
          }

          $hashFile = Join-Path $PWD 'LAB-LOCAL-OUTPUT\RC-EXE-SHA256.txt'
          $exeFiles |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object {
              $relative = $_.Path.Substring($sourceRoot.Length).TrimStart('\')
              "$($_.Hash) *$relative"
            } |
            Set-Content -LiteralPath $hashFile -Encoding ASCII

          Write-Host "Validated RC executables: $($exeFiles.Count)" -ForegroundColor Green
          Get-Content -LiteralPath $hashFile | ForEach-Object { Write-Host $_ }

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-lab-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            LAB-LOCAL-OUTPUT/**
            NVDA-2026.2-HARDENED-SOURCE-V5/testOutput/unit/**

      - name: Upload RC binaries
        if: ${{ success() && steps.mode.outputs.mode == 'All' }}
        uses: actions/upload-artifact@v4
        with:
          name: nvda-2026.2-hardened-rc2-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            NVDA-2026.2-HARDENED-SOURCE-V5/output/nvda_2026.2rc2.exe
            NVDA-2026.2-HARDENED-SOURCE-V5/dist/**
            LAB-LOCAL-OUTPUT/RC-EXE-SHA256.txt
