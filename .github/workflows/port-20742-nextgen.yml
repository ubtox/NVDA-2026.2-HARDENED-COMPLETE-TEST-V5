name: Stage NextGen locale smoke port

on:
  push:
    branches:
      - 'automation/port-20742-nextgen'

permissions:
  contents: write

jobs:
  port:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream 20742
        shell: pwsh
        run: |
          git fetch --no-tags https://github.com/nvaccess/nvda.git 77973a3015e9a58dc8638d9a6dc61b9f60e853b4
          git rev-parse FETCH_HEAD

      - name: Apply surgical locale smoke port
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          source_root = root / "NVDA-2026.2-HARDENED-SOURCE-V5"
          upstream_ref = "FETCH_HEAD"

          def upstream_text(path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"{upstream_ref}:{path}"],
                  text=True,
                  encoding="utf-8",
              )

          def replace_block(current: str, upstream: str, start: str, end: str) -> str:
              cur_start = current.index(start)
              cur_end = current.index(end, cur_start)
              up_start = upstream.index(start)
              up_end = upstream.index(end, up_start)
              return current[:cur_start] + upstream[up_start:up_end] + current[cur_end:]

          nvda_lib_path = source_root / "tests/system/libraries/NvdaLib.py"
          current_nvda_lib = nvda_lib_path.read_text(encoding="utf-8")
          upstream_nvda_lib = upstream_text("tests/system/libraries/NvdaLib.py")

          replacements = (
              ("\tdef _startNVDAProcess(", "\tdef _startNVDAInstallerProcess("),
              ("\tdef start_NVDA(", "\tdef save_NVDA_log("),
              ("\tdef save_NVDA_log(", "\tdef save_py2exe_boot_log("),
          )
          for start, end in replacements:
              current_nvda_lib = replace_block(current_nvda_lib, upstream_nvda_lib, start, end)
          nvda_lib_path.write_text(current_nvda_lib, encoding="utf-8", newline="")

          for rel in ("tests/system/robot/l10nTests.py", "tests/system/robot/l10nTests.robot"):
              target = source_root / rel
              if target.exists():
                  raise RuntimeError(f"Refusing to overwrite pre-existing {target}")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(upstream_text(rel), encoding="utf-8", newline="")

          workflow_path = root / ".github/workflows/evolution-validation.yml"
          workflow = workflow_path.read_text(encoding="utf-8")
          smoke_marker = "      - name: Smoke test all locales\n"
          if smoke_marker in workflow:
              raise RuntimeError("Locale smoke step already exists")

          upload_marker = "      - name: Upload evolution evidence and binaries\n"
          if upload_marker not in workflow:
              raise RuntimeError("Evolution artifact upload marker not found")

          smoke_lines = [
              "      - name: Smoke test all locales",
              "        shell: pwsh",
              "        run: |",
              "          $sourceRoot = Join-Path $PWD 'NVDA-2026.2-HARDENED-SOURCE-V5'",
              "          Push-Location $sourceRoot",
              "          try {",
              "            $outputRoot = Join-Path $sourceRoot 'output'",
              "            $launchers = @(Get-ChildItem -LiteralPath $outputRoot -Filter 'nvda*.exe' -File -ErrorAction Stop)",
              "            if ($launchers.Count -eq 0) {",
              "              throw 'No Evolution launcher available for locale smoke testing.'",
              "            }",
              "",
              "            $launcherDir = Join-Path $env:RUNNER_TEMP 'nvda-l10n-launcher'",
              "            Remove-Item -LiteralPath $launcherDir -Recurse -Force -ErrorAction SilentlyContinue",
              "            New-Item -ItemType Directory -Force -Path $launcherDir | Out-Null",
              "            Copy-Item -LiteralPath $launchers[0].FullName -Destination $launcherDir",
              "",
              "            New-Item -ItemType Directory -Force -Path '.\\testOutput\\install' | Out-Null",
              "            $env:nvdaLauncherDir = $launcherDir",
              "            & .\\ci\\scripts\\installNVDA.ps1",
              "            if ($LASTEXITCODE -ne 0) {",
              "              throw 'NVDA silent installation failed before locale smoke testing.'",
              "            }",
              "",
              "            $env:INCLUDE_SYSTEM_TEST_TAGS = 'l10n'",
              "            & .\\ci\\scripts\\tests\\systemTests.ps1",
              "            if ($LASTEXITCODE -ne 0) {",
              "              throw 'Locale smoke test failed.'",
              "            }",
              "          } finally {",
              "            Pop-Location",
              "          }",
              "",
          ]
          smoke_step = "\n".join(smoke_lines) + "\n"
          workflow = workflow.replace(upload_marker, smoke_step + upload_marker, 1)

          unit_artifact = "            NVDA-2026.2-HARDENED-SOURCE-V5/testOutput/unit/**\n"
          system_artifact = "            NVDA-2026.2-HARDENED-SOURCE-V5/testOutput/system/**\n"
          if unit_artifact not in workflow:
              raise RuntimeError("Unit-test artifact marker not found")
          if system_artifact not in workflow:
              workflow = workflow.replace(unit_artifact, unit_artifact + system_artifact, 1)
          workflow_path.write_text(workflow, encoding="utf-8", newline="")
          '@ | python -

      - name: Verify staged scope
        shell: pwsh
        run: |
          $expected = @(
            '.github/workflows/evolution-validation.yml',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/system/libraries/NvdaLib.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/system/robot/l10nTests.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/system/robot/l10nTests.robot'
          )
          $actual = @(git status --short | ForEach-Object { $_.Substring(3) })
          $unexpected = @($actual | Where-Object { $_ -notin $expected })
          $missing = @($expected | Where-Object { $_ -notin $actual })
          if ($unexpected.Count -gt 0 -or $missing.Count -gt 0) {
            throw "Staged scope mismatch. Unexpected=[$($unexpected -join ', ')] Missing=[$($missing -join ', ')]"
          }
          git diff --check

      - name: Commit clean staging result
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/port-20742-nextgen.yml' -Force
          git add -A
          $changed = @(git diff --cached --name-only)
          $expected = @(
            '.github/workflows/evolution-validation.yml',
            '.github/workflows/port-20742-nextgen.yml',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/system/libraries/NvdaLib.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/system/robot/l10nTests.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/system/robot/l10nTests.robot'
          )
          $unexpected = @($changed | Where-Object { $_ -notin $expected })
          $missing = @($expected | Where-Object { $_ -notin $changed })
          if ($unexpected.Count -gt 0 -or $missing.Count -gt 0) {
            throw "Final scope mismatch. Unexpected=[$($unexpected -join ', ')] Missing=[$($missing -join ', ')]"
          }
          git diff --cached --check
          git commit -m "NextGen: smoke-test all locales (#20742)"
          git push origin HEAD:automation/port-20742-nextgen
