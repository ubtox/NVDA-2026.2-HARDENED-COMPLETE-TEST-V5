name: Finalize UIA evolution once

on:
  push:
    branches:
      - evolution/2026.2-final
    paths:
      - .github/workflows/finalize-uia-cache-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Enable Windows Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: evolution/2026.2-final
          fetch-depth: 0

      - name: Install CPython 3.13.15 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          architecture: x64
          update-environment: true

      - name: Install CPython 3.13.15 x86 helper
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          architecture: x86
          update-environment: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: cpython-3.13.15-windows-x86_64-none

      - name: Apply UIA finalization patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/finalize_uia_cache.py
          if ($LASTEXITCODE -ne 0) { throw "Patch failed: $LASTEXITCODE" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed: $LASTEXITCODE" }

      - name: Format and lint changed Python files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/web.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_NVDAObjects_UIA_cache.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_UIAHandler.py'
          )
          uvx --from ruff==0.15.9 ruff format @files
          if ($LASTEXITCODE -ne 0) { throw "Ruff format failed: $LASTEXITCODE" }
          uvx --from ruff==0.15.9 ruff check @files
          if ($LASTEXITCODE -ne 0) { throw "Ruff check failed: $LASTEXITCODE" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check after Ruff failed: $LASTEXITCODE" }

      - name: Validate expected source delta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/web.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_NVDAObjects_UIA_cache.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_UIAHandler.py'
          )
          $changed = @(git status --short | ForEach-Object { $_.Substring(3) })
          foreach ($path in $expected) {
            if ($changed -notcontains $path) { throw "Expected changed file missing: $path" }
          }
          $unexpected = @($changed | Where-Object { $expected -notcontains $_ })
          if ($unexpected.Count -ne 0) { throw "Unexpected changed files: $($unexpected -join ', ')" }

      - name: Full Evolution validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\LAB-BUILD.ps1 -Mode All -Parallel
          if ($LASTEXITCODE -ne 0) { throw "Full Evolution validation failed: $LASTEXITCODE" }

      - name: Commit only fully validated final changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Final git diff --check failed: $LASTEXITCODE" }

          git rm -- '.github/workflows/finalize-uia-cache-once.yml' '.github/scripts/finalize_uia_cache.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- `
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py' `
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/web.py' `
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_NVDAObjects_UIA_cache.py' `
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_UIAHandler.py'
          git commit -m 'UIA evolution: finalize cache batching and regressions'
          if ($LASTEXITCODE -ne 0) { throw "git commit failed: $LASTEXITCODE" }
          git push origin 'HEAD:evolution/2026.2-final'
          if ($LASTEXITCODE -ne 0) { throw "git push failed: $LASTEXITCODE" }
