name: NVDA Evolution validation
run-name: NVDA Evolution ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches:
      - 'evolution/**'
    paths-ignore:
      - 'VALIDATION-RUNS/**'
      - 'PATCH-BACKUP-*/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvda-evolution-${{ github.ref }}
  cancel-in-progress: true

env:
  VSCMD_SKIP_SENDTELEMETRY: 1
  SCONS_CACHE_MSVC_CONFIG: '.scons_msvc_cache.json'

jobs:
  validate:
    name: Validate NVDA Evolution
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Enable Windows Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout evolution source
        uses: actions/checkout@v6

      - name: Record exact certification target
        shell: pwsh
        run: |
          $logRoot = Join-Path $PWD 'LAB-LOCAL-OUTPUT'
          New-Item -ItemType Directory -Force -Path $logRoot | Out-Null
          @(
            "repository=$env:GITHUB_REPOSITORY"
            "ref=$env:GITHUB_REF"
            "sha=$env:GITHUB_SHA"
            "run_id=$env:GITHUB_RUN_ID"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
          ) | Set-Content -LiteralPath (Join-Path $logRoot 'EVOLUTION-CI-CERTIFICATION.txt') -Encoding utf8

      - name: Install CPython 3.13.15 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          architecture: x64
          update-environment: true

      - name: Install CPython 3.13.15 x86 helper
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          architecture: x86
          update-environment: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: cpython-3.13.15-windows-x86_64-none

      - name: Full evolution validation
        shell: pwsh
        run: |
          $logRoot = Join-Path $PWD 'LAB-LOCAL-OUTPUT'
          New-Item -ItemType Directory -Force -Path $logRoot | Out-Null
          $workflowLog = Join-Path $logRoot 'EVOLUTION-WORKFLOW-COMPLETE.log'

          function Invoke-EvolutionBuild {
            param([switch]$Parallel)

            if ($Parallel) {
              & .\LAB-BUILD.ps1 -Mode All -Parallel *>&1 |
                Tee-Object -FilePath $workflowLog -Append
            } else {
              & .\LAB-BUILD.ps1 -Mode All *>&1 |
                Tee-Object -FilePath $workflowLog -Append
            }
          }

          try {
            Invoke-EvolutionBuild -Parallel
          } catch {
            $_ | Out-String |
              Tee-Object -FilePath $workflowLog -Append |
              Write-Host

            $sharingViolation = Select-String `
              -LiteralPath $workflowLog `
              -SimpleMatch 'The process cannot access the file because it is being used by another process' `
              -Quiet
            if (-not $sharingViolation) {
              throw
            }

            Write-Host 'Transient Windows sharing violation detected; retrying the complete build serially.' -ForegroundColor Yellow
            Start-Sleep -Seconds 5
            try {
              Invoke-EvolutionBuild
            } catch {
              $_ | Out-String |
                Tee-Object -FilePath $workflowLog -Append |
                Write-Host
              throw
            }
          }

      - name: Verify Evolution binary identity
        shell: pwsh
        run: |
          $outputRoot = Join-Path $PWD 'NVDA-2026.2-HARDENED-SOURCE-V5\output'
          $installers = @(Get-ChildItem -LiteralPath $outputRoot -Filter 'nvda*.exe' -File -ErrorAction Stop)
          if ($installers.Count -eq 0) {
            throw 'No NVDA installer was produced.'
          }
          $wrongIdentity = @($installers | Where-Object { $_.Name -notmatch 'evolution' })
          if ($wrongIdentity.Count -gt 0) {
            $names = ($wrongIdentity.Name -join ', ')
            throw "Evolution workflow produced ambiguously named installer(s): $names"
          }
          $installers | ForEach-Object {
            Write-Host "Evolution installer verified: $($_.Name)"
          }

      - name: Upload evolution evidence and binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-evolution-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            LAB-LOCAL-OUTPUT/**
            NVDA-2026.2-HARDENED-SOURCE-V5/testOutput/unit/**
            NVDA-2026.2-HARDENED-SOURCE-V5/output/**
            NVDA-2026.2-HARDENED-SOURCE-V5/dist/**
