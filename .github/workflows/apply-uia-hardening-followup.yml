name: Apply UIA hardening follow-up once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-uia-hardening-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden remaining UIA text retrieval paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('NVDA-2026.2-HARDENED-SOURCE-V5')

          def replace_once(rel_path: str, old: str, new: str) -> None:
              path = root / rel_path
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{rel_path}: expected exactly one match, got {count}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace_once(
              'source/NVDAObjects/UIA/winConsoleUIA.py',
              '\t\ttext = charInfo._rangeObj.getText(-1)',
              '\t\ttext = charInfo._getTextFromUIARange(charInfo._rangeObj)',
          )
          replace_once(
              'source/NVDAObjects/UIA/winConsoleUIA.py',
              '\t\tlineText = lineInfo._rangeObj.getText(-1)',
              '\t\tlineText = lineInfo._getTextFromUIARange(lineInfo._rangeObj)',
          )
          replace_once(
              'source/appModules/devenv.py',
              '\t\treturn lineNumberRange.GetText(-1)',
              '\t\treturn super()._getTextFromUIARange(lineNumberRange)',
          )
          replace_once(
              'source/NVDAObjects/UIA/wordDocument.py',
              '\t\t\ttext = obj.UIATextPattern.DocumentRange.GetText(-1).strip()',
              '\t\t\ttext = UIATextInfo(obj, textInfos.POSITION_ALL).text.strip()',
          )
          replace_once(
              'source/NVDAObjects/UIA/web.py',
              '\t\t\t\ttext = textRange.getText(-1)',
              '\t\t\t\ttext = self._getTextFromUIARange(textRange)',
          )
          replace_once(
              'source/NVDAObjects/UIA/spartanEdge.py',
              '\t\t\tlog.debug(f"full text: {textRange.getText(-1)}")',
              '\t\t\tlog.debug(f"full text: {self._getTextFromUIARange(textRange)}")',
          )
          replace_once(
              'source/UIAHandler/remote.py',
              '\tStyleId,\n)\n\n\n_isSupported: bool = False',
              '\tStyleId,\n)\nfrom .utils import normalizeUIAText\n\n\ndef _normalizeProviderText(text: str) -> str:\n\treturn normalizeUIAText(text)\n\n\n_isSupported: bool = False',
          )
          replace_once(
              'source/UIAHandler/remote.py',
              '\t\tyield level, label, paragraphRange',
              '\t\tyield level, _normalizeProviderText(cast(str, label)), paragraphRange',
          )
          replace_once(
              'source/UIAHandler/remote.py',
              '\t\tcast(str, label),',
              '\t\t_normalizeProviderText(cast(str, label)),',
          )
          PY

          git diff --check
          git diff --stat

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- NVDA-2026.2-HARDENED-SOURCE-V5/source
          git rm -- .github/workflows/apply-uia-hardening-followup.yml
          git commit -m 'UIA: harden remaining provider text paths'
          git push origin HEAD:main
