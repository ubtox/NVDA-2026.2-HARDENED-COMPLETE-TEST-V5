name: One-shot exact LiveText upstream port

on:
  push:
    branches:
      - 'evolution/2026.2-next'
    paths:
      - '.github/workflows/port-livetext-once.yml'

permissions:
  contents: write

jobs:
  port:
    name: Port verified upstream LiveText blob
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout Evolution branch
        uses: actions/checkout@v6
        with:
          ref: evolution/2026.2-next
          fetch-depth: 0

      - name: Replace LiveText source with exact verified upstream blob
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/behaviors.py'
          $expectedBefore = '4089633b1e2217bf467f552d10f1879a4e511caa'
          $upstreamCommit = '5344d4bdab360be099b45ba2b21565ebf662fe89'
          $expectedAfter = '07f785c2a348c9760ea261c040a538101de51ecd'

          $before = (git hash-object -- $target).Trim()
          if ($before -ne $expectedBefore) {
            throw "Unexpected Evolution behaviors.py blob before port: $before"
          }

          git remote remove nvaccess 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          git remote add nvaccess https://github.com/nvaccess/nvda.git
          git fetch --no-tags --depth=1 nvaccess $upstreamCommit
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch verified NV Access commit.' }

          $upstreamSpec = "${upstreamCommit}:source/NVDAObjects/behaviors.py"
          $upstreamBlob = (git rev-parse $upstreamSpec).Trim()
          if ($upstreamBlob -ne $expectedAfter) {
            throw "Unexpected upstream behaviors.py blob: $upstreamBlob"
          }

          git update-index --add --cacheinfo 100644 $upstreamBlob $target
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage verified upstream blob.' }
          git checkout-index -f -- $target
          if ($LASTEXITCODE -ne 0) { throw 'Unable to materialize verified upstream blob.' }

          $after = (git hash-object -- $target).Trim()
          if ($after -ne $expectedAfter) {
            throw "Materialized behaviors.py does not match verified upstream blob: $after"
          }

          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed for LiveText port.' }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Core: port cooperative LiveText flood handling from NV Access'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit LiveText port.' }
          git push origin HEAD:evolution/2026.2-next
          if ($LASTEXITCODE -ne 0) { throw 'Unable to push LiveText port.' }

          Write-Host "Verified LiveText port complete: $expectedBefore -> $expectedAfter"
