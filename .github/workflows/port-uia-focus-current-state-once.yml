name: One-shot port UIA current focus validation

on:
  push:
    branches:
      - 'evolution/2026.2-next'
    paths:
      - '.github/workflows/port-uia-focus-current-state-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Enable Windows Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout exact Evolution branch
        uses: actions/checkout@v6
        with:
          ref: evolution/2026.2-next
          fetch-depth: 0

      - name: Apply guarded NV Access 20764 port and regression test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          source = Path(r"NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py")
          text = source.read_text(encoding="utf-8")
          old = """\tdef _get_shouldAllowUIAFocusEvent(self):
          \t\ttry:
          \t\t\treturn bool(self._getUIACacheablePropertyValue(UIAHandler.UIA_HasKeyboardFocusPropertyId))
          \t\texcept COMError:
          \t\t\treturn True
          """
          new = """\tdef _get_shouldAllowUIAFocusEvent(self):
          \t\ttry:
          \t\t\t# Focus may have moved since the event sender's cache was populated.
          \t\t\treturn bool(self.UIAElement.currentHasKeyboardFocus)
          \t\texcept COMError:
          \t\t\treturn True
          """
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one UIA focus guard hunk, found {text.count(old)}")
          text = text.replace(old, new, 1)
          with source.open("w", encoding="utf-8", newline="") as f:
              f.write(text)

          test_path = Path(r"NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_NVDAObjects_UIA_focus.py")
          if test_path.exists():
              raise SystemExit(f"Refusing to overwrite existing {test_path}")
          test_text = '''# A part of NonVisual Desktop Access (NVDA)
          # This file is covered by the GNU General Public License.
          # See the file COPYING for more details.
          # Copyright (C) 2026 NV Access Limited, NVDA Evolution contributors

          import unittest
          from unittest.mock import Mock, patch

          from NVDAObjects.UIA import UIA


          class TestUIAFocusEvent(unittest.TestCase):
          \tdef test_shouldAllowUIAFocusEventIgnoresStaleCache(self):
          \t\tobj = object.__new__(UIA)
          \t\tobj.UIAElement = Mock(currentHasKeyboardFocus=False)

          \t\twith patch.object(UIA, "_getUIACacheablePropertyValue", return_value=True) as getCachedValue:
          \t\t\tself.assertFalse(obj._get_shouldAllowUIAFocusEvent())
          \t\t\tgetCachedValue.assert_not_called()
          '''
          # Remove YAML block indentation while preserving tabs used by NVDA source style.
          test_text = "\n".join(line[10:] if line.startswith("          ") else line for line in test_text.splitlines()) + "\n"
          with test_path.open("w", encoding="utf-8", newline="") as f:
              f.write(test_text)

          doc = Path("EVOLUTION-2026.2-NEXT.md")
          doc_text = doc.read_text(encoding="utf-8")
          anchor = """- The existing `_getUIACacheablePropertyValue_handlesCOMErrors` boundary for UIA state retrieval was audited and retained; no duplicate port was needed.
          - Broader disconnected-provider recovery, property batching and event-storm measurements remain planned.
          """
          replacement = """- The existing `_getUIACacheablePropertyValue_handlesCOMErrors` boundary for UIA state retrieval was audited and retained; no duplicate port was needed.
          - NV Access current-focus validation (#20764) ported: UIA focus events now validate live `currentHasKeyboardFocus` instead of trusting the event sender's potentially stale cache.
          - A dedicated regression test verifies stale cached focus state cannot admit an intermediate provider focus event.
          - Broader disconnected-provider recovery, property batching and event-storm measurements remain planned.
          """
          if doc_text.count(anchor) != 1:
              raise SystemExit(f"Expected exactly one Evolution Track 2 anchor, found {doc_text.count(anchor)}")
          doc_text = doc_text.replace(anchor, replacement, 1)
          with doc.open("w", encoding="utf-8", newline="") as f:
              f.write(doc_text)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Guarded UIA port failed: $LASTEXITCODE" }

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed: $LASTEXITCODE" }

          $expected = @(
            'EVOLUTION-2026.2-NEXT.md',
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_NVDAObjects_UIA_focus.py'
          ) | Sort-Object
          $actual = @(git status --short | ForEach-Object { $_.Substring(3) }) | Sort-Object
          if (($actual -join "`n") -ne ($expected -join "`n")) {
            throw "Unexpected changed files: $($actual -join ', ')"
          }

      - name: Commit exact port
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'EVOLUTION-2026.2-NEXT.md' 'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py' 'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_NVDAObjects_UIA_focus.py'
          git commit -m 'UIA: port current focus validation from NV Access #20764'
          if ($LASTEXITCODE -ne 0) { throw "git commit failed: $LASTEXITCODE" }
          git push origin 'HEAD:evolution/2026.2-next'
          if ($LASTEXITCODE -ne 0) { throw "git push failed: $LASTEXITCODE" }
