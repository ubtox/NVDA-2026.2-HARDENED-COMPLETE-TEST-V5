name: One-shot UIA SelectionContainer resilience port

on:
  push:
    branches:
      - 'evolution/2026.2-next'
    paths:
      - '.github/workflows/port-uia-selection-container-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Enable Windows Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout evolution head
        uses: actions/checkout@v6
        with:
          ref: evolution/2026.2-next
          fetch-depth: 0

      - name: Install CPython 3.13.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
          architecture: 'x64'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Apply exact provider failure boundary and regression test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py'
          $test = 'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_UIASelectionContainer.py'
          $expectedSourceBlob = 'd169d1ff4742356e992375590dce107028714476'
          $actualSourceBlob = (git hash-object -- $source).Trim()
          if ($actualSourceBlob -ne $expectedSourceBlob) {
            throw "Unexpected UIA source blob: $actualSourceBlob"
          }
          if (Test-Path $test) {
            throw "Regression test path already exists: $test"
          }

          @'
          from pathlib import Path

          source = Path("NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py")
          data = source.read_bytes()
          nl = b"\r\n" if b"\r\n" in data[:4096] else b"\n"
          old = nl.join((
              b"\t\tp = self.UIASelectionItemPattern",
              b"\t\tif not p:",
              b"\t\t\treturn None",
              b"\t\te = p.currentSelectionContainer",
              b"\t\tif not e:",
          ))
          new = nl.join((
              b"\t\tp = self.UIASelectionItemPattern",
              b"\t\tif not p:",
              b"\t\t\treturn None",
              b"\t\ttry:",
              b"\t\t\te = p.currentSelectionContainer",
              b"\t\texcept COMError:",
              b"\t\t\t# Some providers (e.g. Qt's QWindowsUiaSelectionItemProvider when the",
              b"\t\t\t# accessible has no actionInterface) raise instead of returning a value.",
              b"\t\t\t# Treat the same as no selection container so focus speech is not aborted.",
              b"\t\t\treturn None",
              b"\t\tif not e:",
          ))
          if data.count(old) != 1:
              raise SystemExit(f"Expected exactly one SelectionContainer anchor, found {data.count(old)}")
          source.write_bytes(data.replace(old, new, 1))

          test = Path("NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_UIASelectionContainer.py")
          test.write_text(
              '''# A part of NonVisual Desktop Access (NVDA)\n'''
              '''# Copyright (C) 2026 NVDA Evolution contributors\n'''
              '''# This file is covered by the GNU General Public License.\n'''
              '''# See the file COPYING for more details.\n\n'''
              '''from unittest import TestCase\n'''
              '''from unittest.mock import Mock\n\n'''
              '''from comtypes import COMError\n\n'''
              '''from NVDAObjects.UIA import UIA\n\n\n'''
              '''class _FailingSelectionItemPattern:\n'''
              '''\t@property\n'''
              '''\tdef currentSelectionContainer(self) -> object:\n'''
              '''\t\traise COMError(-2147220991, "provider failure", None)\n\n\n'''
              '''class TestUIASelectionContainerProviderFailure(TestCase):\n'''
              '''\tdef test_COMErrorIsTreatedAsMissingSelectionContainer(self) -> None:\n'''
              '''\t\tuiObject = Mock()\n'''
              '''\t\tuiObject.UIASelectionItemPattern = _FailingSelectionItemPattern()\n\n'''
              '''\t\tself.assertIsNone(UIA._get_selectionContainer(uiObject))\n''',
              encoding="utf-8",
              newline="\n",
          )
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Exact source/test transformation failed: $LASTEXITCODE" }

          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) } | Sort-Object)
          $expected = @($source, $test) | Sort-Object
          if (($changed -join "`n") -ne ($expected -join "`n")) {
            throw "Unexpected changed files: $($changed -join ', ')"
          }

          python -m py_compile $source $test
          if ($LASTEXITCODE -ne 0) { throw "Python compile failed: $LASTEXITCODE" }
          uvx --from ruff==0.15.9 ruff check $source $test
          if ($LASTEXITCODE -ne 0) { throw "Ruff check failed: $LASTEXITCODE" }
          uvx --from ruff==0.15.9 ruff format --check $source $test
          if ($LASTEXITCODE -ne 0) { throw "Ruff format check failed: $LASTEXITCODE" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed: $LASTEXITCODE" }

      - name: Commit and push exact resilience port
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py' 'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_UIASelectionContainer.py'
          git commit -m 'UIA: contain SelectionContainer provider failures'
          if ($LASTEXITCODE -ne 0) { throw "git commit failed: $LASTEXITCODE" }
          git push origin 'HEAD:evolution/2026.2-next'
          if ($LASTEXITCODE -ne 0) { throw "git push failed: $LASTEXITCODE" }
