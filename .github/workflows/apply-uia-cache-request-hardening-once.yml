name: One-shot UIA cache-request creation hardening

on:
  push:
    branches:
      - 'evolution/2026.2-uia-cache-request-hardening'
    paths:
      - '.github/workflows/apply-uia-cache-request-hardening-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply and validate UIA cache-request hardening
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Enable Windows Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout staging branch
        uses: actions/checkout@v6
        with:
          ref: evolution/2026.2-uia-cache-request-hardening
          fetch-depth: 0

      - name: Install CPython 3.13.15 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          architecture: x64
          update-environment: true

      - name: Install CPython 3.13.15 x86 helper
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          architecture: x86
          update-environment: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: cpython-3.13.15-windows-x86_64-none

      - name: Apply exact source and regression-test changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          root = Path("NVDA-2026.2-HARDENED-SOURCE-V5")
          source = root / "source/NVDAObjects/UIA/__init__.py"
          tests = root / "tests/unit/test_NVDAObjects_UIA_cache.py"

          source_text = source.read_text(encoding="utf-8")
          source_old = (
              "\t\tcacheRequest = UIAHandler.handler.clientObject.createCacheRequest()\n"
              "\t\tacceptedIDs = set()\n"
          )
          source_new = (
              "\t\ttry:\n"
              "\t\t\tcacheRequest = UIAHandler.handler.clientObject.createCacheRequest()\n"
              "\t\texcept COMError:\n"
              "\t\t\tlog.debugWarning(\n"
              "\t\t\t\t\"IUIAutomation.createCacheRequest failed; falling back to current property reads\",\n"
              "\t\t\t\texc_info=True,\n"
              "\t\t\t)\n"
              "\t\t\treturn\n"
              "\t\tacceptedIDs = set()\n"
          )
          if "IUIAutomation.createCacheRequest failed; falling back to current property reads" not in source_text:
              count = source_text.count(source_old)
              if count != 1:
                  raise SystemExit(f"cache-request source anchor: expected one match, found {count}")
              source.write_text(source_text.replace(source_old, source_new, 1), encoding="utf-8", newline="\n")

          test_text = tests.read_text(encoding="utf-8")
          marker = "\tdef test_cacheRequestCreationFailureLeavesCacheEmpty(self) -> None:\n"
          if marker not in test_text:
              anchor = "\n\tdef test_buildFailureLeavesCacheEmpty(self) -> None:\n"
              addition = (
                  "\n\tdef test_cacheRequestCreationFailureLeavesCacheEmpty(self) -> None:\n"
                  "\t\telementCache = {}\n"
                  "\t\thandler = Mock()\n"
                  "\t\thandler.clientObject.createCacheRequest.side_effect = COMError(-1, \"failure\", None)\n"
                  "\t\tuiObject = Mock()\n"
                  "\t\tuiObject._coreCycleUIAPropertyCacheElementCache = elementCache\n\n"
                  "\t\twith patch.object(UIAHandler, \"handler\", handler):\n"
                  "\t\t\tUIA._prefetchUIACacheForPropertyIDs(uiObject, {101, 103})\n\n"
                  "\t\tself.assertEqual({}, elementCache)\n"
                  "\t\tuiObject.UIAElement.buildUpdatedCache.assert_not_called()\n"
              )
              count = test_text.count(anchor)
              if count != 1:
                  raise SystemExit(f"cache-request test anchor: expected one match, found {count}")
              tests.write_text(test_text.replace(anchor, addition + anchor, 1), encoding="utf-8", newline="\n")
          '@ | Set-Content -LiteralPath .apply-uia-cache-request-hardening.py -Encoding utf8

          python .apply-uia-cache-request-hardening.py
          Remove-Item -LiteralPath .apply-uia-cache-request-hardening.py -Force

          $expected = @(
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_NVDAObjects_UIA_cache.py'
          )
          $changed = @(git diff --name-only)
          if ($changed.Count -ne $expected.Count) {
            throw "Unexpected changed-file count before validation: $($changed -join ', ')"
          }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) {
              throw "Expected changed file missing: $path"
            }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check failed: $LASTEXITCODE"
          }

      - name: Validate focused files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'NVDA-2026.2-HARDENED-SOURCE-V5'
          $files = @(
            (Join-Path $root 'source\NVDAObjects\UIA\__init__.py'),
            (Join-Path $root 'tests\unit\test_NVDAObjects_UIA_cache.py')
          )
          uvx --from ruff==0.15.9 ruff check @files
          if ($LASTEXITCODE -ne 0) { throw "Ruff check failed: $LASTEXITCODE" }
          uvx --from ruff==0.15.9 ruff format --check @files
          if ($LASTEXITCODE -ne 0) { throw "Ruff format check failed: $LASTEXITCODE" }

      - name: Validate source build and unit suite serially
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\LAB-BUILD.ps1 -Mode Source
          if ($LASTEXITCODE -ne 0) {
            throw "LAB source validation failed: $LASTEXITCODE"
          }

      - name: Commit validated change and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm -- '.github/workflows/apply-uia-cache-request-hardening-once.yml'
          $expected = @(
            '.github/workflows/apply-uia-cache-request-hardening-once.yml',
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_NVDAObjects_UIA_cache.py'
          )
          $changed = @(git diff --name-only HEAD)
          if ($changed.Count -ne $expected.Count) {
            throw "Unexpected final changed-file count: $($changed -join ', ')"
          }
          foreach ($path in $expected) {
            if ($changed -notcontains $path) {
              throw "Expected final changed file missing: $path"
            }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "Final git diff --check failed: $LASTEXITCODE"
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'UIA: tolerate cache request creation failures'
          if ($LASTEXITCODE -ne 0) {
            throw "git commit failed: $LASTEXITCODE"
          }
          git push origin 'HEAD:evolution/2026.2-uia-cache-request-hardening'
          if ($LASTEXITCODE -ne 0) {
            throw "git push failed: $LASTEXITCODE"
          }
