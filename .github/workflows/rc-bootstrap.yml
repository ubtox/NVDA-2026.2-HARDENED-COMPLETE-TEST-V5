name: RC bootstrap patch

on:
  push:
    branches:
      - "rc/2026.2-hardened-rc1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-uia:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout RC
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact UIA mixed-value short-circuit fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path(r"NVDA-2026.2-HARDENED-SOURCE-V5/source/UIAHandler/utils.py")
          text = path.read_text(encoding="utf-8").replace("\r\n", "\n")
          old = (
              "\tif val == UIAHandler.handler.ReservedMixedAttributeValue:\n"
              "\t\tif not ignoreMixedValues:\n"
              "\t\t\traise UIAMixedAttributeError\n"
          )
          new = (
              "\tif not ignoreMixedValues and val == UIAHandler.handler.ReservedMixedAttributeValue:\n"
              "\t\traise UIAMixedAttributeError\n"
          )
          if old not in text:
              if new in text:
                  print("UIA RC fix already present.")
                  raise SystemExit(0)
              raise SystemExit("Expected UIA block not found; refusing non-exact patch.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          print("Applied exact UIA RC fix.")
          '@ | python -

      - name: Commit patch when changed
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host "No patch commit required."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "NVDA-2026.2-HARDENED-SOURCE-V5/source/UIAHandler/utils.py"
          git commit -m "Fix UIA mixed-value short-circuit for RC"
          git push origin "HEAD:${{ github.ref_name }}"
