name: Surgical backport 20698

on:
  push:
    branches:
      - automation/backport-20698

permissions:
  contents: write

concurrency:
  group: automation-backport-20698
  cancel-in-progress: false

jobs:
  backport:
    runs-on: windows-latest
    steps:
      - name: Enable Git long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Unable to enable Git long paths' }

      - name: Checkout protected target branch
        uses: actions/checkout@v4
        with:
          ref: evolution/2026.2-nextgen
          fetch-depth: 0
          path: r
          sparse-checkout: |
            NVDA-2026.2-HARDENED-SOURCE-V5
          sparse-checkout-cone-mode: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply upstream 20698 with three-way merge
        shell: pwsh
        working-directory: r
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '4fd3f91381c71ae4595eeb9eee765686a31f1a97'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Target branch moved: expected $expected, got $actual"
          }

          git fetch --no-tags --depth=2 https://github.com/nvaccess/nvda.git acb904f88ebdbfb7415cddc2188a38f36a675243
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch upstream #20698 history' }

          $patch = Join-Path $env:RUNNER_TEMP '20698.patch'
          curl.exe -fsSL 'https://github.com/nvaccess/nvda/pull/20698.patch' -o $patch
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download upstream #20698 patch' }

          git apply --3way --directory=NVDA-2026.2-HARDENED-SOURCE-V5 --exclude=user_docs/en/changes.md $patch
          if ($LASTEXITCODE -ne 0) { throw 'Three-way application of #20698 failed' }

          $changes = 'NVDA-2026.2-HARDENED-SOURCE-V5/user_docs/en/changes.md'
          $text = [IO.File]::ReadAllText($changes)
          $nl = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
          $needle = "### Bug Fixes${nl}${nl}"
          if ($text.IndexOf($needle) -lt 0 -or $text.IndexOf($needle) -ne $text.LastIndexOf($needle)) {
            throw 'Expected exactly one local 2026.2 Bug Fixes anchor'
          }
          $bullet = '* 64-bit NVDA now reports the correct location and label for Win32 menu items of 32-bit applications when display scaling is above 100%. (#19225, #20158, @christopherpross)' + $nl
          $text = $text.Replace($needle, $needle + $bullet)
          [IO.File]::WriteAllText($changes, $text, [Text.UTF8Encoding]::new($false))

          python -m py_compile `
            NVDA-2026.2-HARDENED-SOURCE-V5/source/locationHelper.py `
            NVDA-2026.2-HARDENED-SOURCE-V5/source/windowUtils.py `
            NVDA-2026.2-HARDENED-SOURCE-V5/source/winBindings/user32.py `
            NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/IAccessible/__init__.py `
            NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_locationHelper.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax validation failed' }

          git diff --check HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

          $expectedFiles = @(
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/IAccessible/__init__.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/locationHelper.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/winBindings/user32.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/source/windowUtils.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_locationHelper.py',
            'NVDA-2026.2-HARDENED-SOURCE-V5/user_docs/en/changes.md'
          ) | Sort-Object
          $actualFiles = @(git diff --name-only HEAD) | Sort-Object
          $unexpected = Compare-Object $expectedFiles $actualFiles
          if ($unexpected) {
            throw "Unexpected changed-file set: $($actualFiles -join ', ')"
          }

          $remoteLine = git ls-remote origin refs/heads/evolution/2026.2-nextgen
          if ($LASTEXITCODE -ne 0 -or -not $remoteLine) { throw 'Unable to re-read protected target HEAD' }
          $remote = ($remoteLine -split "`t")[0]
          if ($remote -ne $expected) {
            throw "Target branch moved before push: expected $expected, got $remote"
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $expectedFiles
          git commit -m 'Backport #20698: fix x86 Win32 menu locations at high DPI'
          if ($LASTEXITCODE -ne 0) { throw 'Backport commit failed' }
          git push origin HEAD:evolution/2026.2-nextgen
          if ($LASTEXITCODE -ne 0) { throw 'Backport push failed' }
