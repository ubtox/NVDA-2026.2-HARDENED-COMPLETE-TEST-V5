name: One-shot Ruff format eventHandler

on:
  push:
    branches:
      - 'evolution/2026.2-next'
    paths:
      - '.github/workflows/format-event-handler-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Enable Windows Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: evolution/2026.2-next
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Format only eventHandler with pinned Ruff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'NVDA-2026.2-HARDENED-SOURCE-V5/source/eventHandler.py'
          uvx --from ruff==0.15.9 ruff format $path
          if ($LASTEXITCODE -ne 0) { throw "Ruff format failed: $LASTEXITCODE" }

          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne $path) {
            throw "Unexpected formatted files: $($changed -join ', ')"
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed: $LASTEXITCODE" }

      - name: Commit exact formatting result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'NVDA-2026.2-HARDENED-SOURCE-V5/source/eventHandler.py'
          git commit -m 'Format event coalescing with Ruff 0.15.9'
          if ($LASTEXITCODE -ne 0) { throw "git commit failed: $LASTEXITCODE" }
          git push origin 'HEAD:evolution/2026.2-next'
          if ($LASTEXITCODE -ne 0) { throw "git push failed: $LASTEXITCODE" }
