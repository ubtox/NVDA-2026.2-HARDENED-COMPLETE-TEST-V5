name: NVDA LAB validation

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'VALIDATION-RUNS/**'
      - 'PATCH-BACKUP-*/**'
  workflow_dispatch:
    inputs:
      buildMode:
        description: LAB build mode
        required: true
        default: Source
        type: choice
        options:
          - Source
          - All

concurrency:
  group: nvda-lab-${{ github.ref }}
  cancel-in-progress: true

env:
  VSCMD_SKIP_SENDTELEMETRY: 1
  SCONS_CACHE_MSVC_CONFIG: '.scons_msvc_cache.json'

jobs:
  validate:
    name: Validate NVDA 2026.2 LAB
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout LAB repository
        uses: actions/checkout@v6

      - name: Install CPython 3.13.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
          architecture: x64
          update-environment: true

      - name: Install CPython 3.13.13 x86 helper
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
          architecture: x86
          update-environment: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: cpython-3.13.13-windows-x86_64-none

      - name: Resolve build mode
        id: mode
        shell: pwsh
        run: |
          $mode = '${{ github.event.inputs.buildMode }}'
          if ([string]::IsNullOrWhiteSpace($mode)) {
            $mode = 'Source'
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT

      - name: Run LAB validation
        shell: pwsh
        run: .\LAB-BUILD.ps1 -Mode '${{ steps.mode.outputs.mode }}'

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-lab-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            LAB-LOCAL-OUTPUT/**
            NVDA-2026.2-HARDENED-SOURCE-V5/testOutput/unit/**

      - name: Upload LAB binaries
        if: ${{ success() && github.event_name == 'workflow_dispatch' && github.event.inputs.buildMode == 'All' }}
        uses: actions/upload-artifact@v4
        with:
          name: nvda-2026.2-lab-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            NVDA-2026.2-HARDENED-SOURCE-V5/output/*.exe
            NVDA-2026.2-HARDENED-SOURCE-V5/dist/**
            LAB-LOCAL-OUTPUT/LAB-ARTIFACT-SHA256-*.txt
