name: Apply UIA value hardening once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-uia-value-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden UIA string boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('NVDA-2026.2-HARDENED-SOURCE-V5')
          uia_path = root / 'source/NVDAObjects/UIA/__init__.py'
          utils_path = root / 'source/UIAHandler/utils.py'

          uia = uia_path.read_text(encoding='utf-8')
          old_property = (
              "\tdef _getUIACacheablePropertyValue(self, ID, ignoreDefault=False):\n"
              "\t\t\"\"\"\n"
              "\t\tFetches the value for a UI Automation property from an element cache available in this core cycle. If not cached then a new value will be fetched.\n"
              "\t\t\"\"\"\n"
              "\t\telementCache = self._coreCycleUIAPropertyCacheElementCache\n"
              "\t\t# If we have a UIAElement whos own cache contains the property, fetch the value from there\n"
              "\t\tcacheElement = elementCache.get(ID, None)\n"
              "\t\tif cacheElement:\n"
              "\t\t\tvalue = cacheElement.getCachedPropertyValueEx(ID, ignoreDefault)\n"
              "\t\telse:\n"
              "\t\t\t# The value is cached nowhere, so ask the UIAElement for its current value for the property\n"
              "\t\t\tvalue = self.UIAElement.getCurrentPropertyValueEx(ID, ignoreDefault)\n"
              "\t\treturn value\n"
          )
          new_property = (
              "\tdef _getUIACacheablePropertyValue(self, ID, ignoreDefault=False):\n"
              "\t\t\"\"\"\n"
              "\t\tFetch a UI Automation property value, using the per-core-cycle cache when available.\n"
              "\t\tString values are normalized at this provider boundary so malformed UTF-16 cannot\n"
              "\t\tescape into NVDA object properties, speech, braille, or logging.\n"
              "\t\t\"\"\"\n"
              "\t\telementCache = self._coreCycleUIAPropertyCacheElementCache\n"
              "\t\t# If we have a UIAElement whos own cache contains the property, fetch the value from there\n"
              "\t\tcacheElement = elementCache.get(ID, None)\n"
              "\t\tif cacheElement:\n"
              "\t\t\tvalue = cacheElement.getCachedPropertyValueEx(ID, ignoreDefault)\n"
              "\t\telse:\n"
              "\t\t\t# The value is cached nowhere, so ask the UIAElement for its current value for the property\n"
              "\t\t\tvalue = self.UIAElement.getCurrentPropertyValueEx(ID, ignoreDefault)\n"
              "\t\treturn normalizeUIAText(value) if isinstance(value, str) else value\n"
          )
          if uia.count(old_property) != 1:
              raise SystemExit(f'Expected one UIA property getter block, got {uia.count(old_property)}')
          uia = uia.replace(old_property, new_property, 1)

          old_text_doc = (
              "\tdef _getTextFromUIARange(self, textRange: IUIAutomationTextRangeT) -> str:\n"
              "\t\t\"\"\"\n"
              "\t\tFetches plain text from the given UI Automation text range.\n"
              "\t\tJust calls getText(-1). This only exists to be overridden for filtering.\n"
              "\t\t\"\"\"\n"
              "\t\treturn normalizeUIAText(textRange.getText(-1))\n"
          )
          new_text_doc = (
              "\tdef _getTextFromUIARange(self, textRange: IUIAutomationTextRangeT) -> str:\n"
              "\t\t\"\"\"\n"
              "\t\tFetch plain text from the given UI Automation text range and normalize malformed\n"
              "\t\tUTF-16 before it reaches Python text consumers. Subclasses may override this for filtering.\n"
              "\t\t\"\"\"\n"
              "\t\treturn normalizeUIAText(textRange.getText(-1))\n"
          )
          if uia.count(old_text_doc) != 1:
              raise SystemExit(f'Expected one UIA text retrieval block, got {uia.count(old_text_doc)}')
          uia = uia.replace(old_text_doc, new_text_doc, 1)
          uia_path.write_text(uia, encoding='utf-8', newline='\n')

          utils = utils_path.read_text(encoding='utf-8')
          old_direct = (
              "\tif val == UIAHandler.handler.ReservedMixedAttributeValue:\n"
              "\t\tif not ignoreMixedValues:\n"
              "\t\t\traise UIAMixedAttributeError\n"
              "\treturn val\n\n\n"
              "def iterUIARangeByUnit"
          )
          new_direct = (
              "\tif val == UIAHandler.handler.ReservedMixedAttributeValue:\n"
              "\t\tif not ignoreMixedValues:\n"
              "\t\t\traise UIAMixedAttributeError\n"
              "\treturn normalizeUIAText(val) if isinstance(val, str) else val\n\n\n"
              "def iterUIARangeByUnit"
          )
          if utils.count(old_direct) != 1:
              raise SystemExit(f'Expected one direct UIA attribute return, got {utils.count(old_direct)}')
          utils = utils.replace(old_direct, new_direct, 1)

          old_fetcher = (
              "\t\tif not ignoreMixedValues and val == UIAHandler.handler.ReservedMixedAttributeValue:\n"
              "\t\t\traise UIAMixedAttributeError\n"
              "\t\treturn val\n\n\n"
              "class BulkUIATextRangeAttributeValueFetcher"
          )
          new_fetcher = (
              "\t\tif not ignoreMixedValues and val == UIAHandler.handler.ReservedMixedAttributeValue:\n"
              "\t\t\traise UIAMixedAttributeError\n"
              "\t\treturn normalizeUIAText(val) if isinstance(val, str) else val\n\n\n"
              "class BulkUIATextRangeAttributeValueFetcher"
          )
          if utils.count(old_fetcher) != 1:
              raise SystemExit(f'Expected one UIA attribute fetcher return, got {utils.count(old_fetcher)}')
          utils = utils.replace(old_fetcher, new_fetcher, 1)

          old_bulk = (
              "\t\tval = self.IDsToValues[ID]\n"
              "\t\tif not ignoreMixedValues and val == UIAHandler.handler.ReservedMixedAttributeValue:\n"
              "\t\t\traise UIAMixedAttributeError\n"
              "\t\treturn val\n\n\n"
              "class FakeEventHandlerGroup"
          )
          new_bulk = (
              "\t\tval = self.IDsToValues[ID]\n"
              "\t\tif not ignoreMixedValues and val == UIAHandler.handler.ReservedMixedAttributeValue:\n"
              "\t\t\traise UIAMixedAttributeError\n"
              "\t\treturn normalizeUIAText(val) if isinstance(val, str) else val\n\n\n"
              "class FakeEventHandlerGroup"
          )
          if utils.count(old_bulk) != 1:
              raise SystemExit(f'Expected one bulk UIA attribute return, got {utils.count(old_bulk)}')
          utils = utils.replace(old_bulk, new_bulk, 1)
          utils_path.write_text(utils, encoding='utf-8', newline='\n')
          PY

          git diff --check
          git diff -- NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py NVDA-2026.2-HARDENED-SOURCE-V5/source/UIAHandler/utils.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/UIA/__init__.py NVDA-2026.2-HARDENED-SOURCE-V5/source/UIAHandler/utils.py
          git rm -- .github/workflows/apply-uia-value-hardening.yml
          git commit -m 'UIA: normalize string values at provider boundaries'
          git push origin HEAD:main
