name: Port NVDA 20698 to NextGen

on:
  push:
    branches:
      - automation/port-20698-nextgen

permissions:
  contents: write

jobs:
  port:
    name: Surgically port upstream 20698
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Enable Windows Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout staging branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply deterministic surgical port
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/nvaccess/nvda.git
          git fetch --no-tags upstream acb904f88ebdbfb7415cddc2188a38f36a675243

          python - <<'PY'
          from pathlib import Path
          import subprocess

          upstream = "acb904f88ebdbfb7415cddc2188a38f36a675243"
          root = Path("NVDA-2026.2-HARDENED-SOURCE-V5")

          def show(path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"{upstream}:{path}"],
                  text=True,
                  encoding="utf-8",
              )

          def read(path: str) -> str:
              return (root / path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              (root / path).write_text(text, encoding="utf-8", newline="\n")

          def extract(text: str, start: str, end: str) -> str:
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              return text[start_index:end_index]

          # These two files are byte-identical to the upstream PR base on NextGen,
          # so the exact post-PR files are safe and preserve all NextGen content.
          for path in ("source/locationHelper.py", "source/windowUtils.py"):
              write(path, show(path))

          # user32.py has unrelated NextGen divergence. Insert only the new API bindings.
          path = "source/winBindings/user32.py"
          current = read(path)
          upstream_text = show(path)
          dpi_block = extract(
              upstream_text,
              "SetThreadDpiAwarenessContext =",
              "SetProcessDPIAware =",
          )
          menu_block = extract(
              upstream_text,
              "GetMenu =",
              "IsWindowUnicode =",
          )
          if "SetThreadDpiAwarenessContext =" not in current:
              marker = "SetProcessDPIAware ="
              if marker not in current:
                  raise RuntimeError(f"Missing insertion marker in {path}: {marker}")
              current = current.replace(marker, dpi_block + marker, 1)
          if "GetMenuItemRect =" not in current:
              marker = "IsWindowUnicode ="
              if marker not in current:
                  raise RuntimeError(f"Missing insertion marker in {path}: {marker}")
              current = current.replace(marker, menu_block + marker, 1)
          write(path, current)

          # IAccessible has NextGen-specific changes. Add only imports, helpers and MenuItem location override.
          path = "source/NVDAObjects/IAccessible/__init__.py"
          current = read(path)
          upstream_text = show(path)
          helper_start = "#: Window message asking a popup menu window for the handle of the menu it displays,"
          class_marker = "class MenuItem(IAccessible):"
          helper_block = extract(upstream_text, helper_start, class_marker)
          upstream_class = upstream_text[upstream_text.index(class_marker):]
          location_method = extract(upstream_class, "\tdef _get_location", "\tdef _get_description")

          if "import ctypes.wintypes" not in current:
              current = current.replace("import ctypes\n", "import ctypes\nimport ctypes.wintypes\n", 1)
          if "import windowUtils" not in current:
              current = current.replace("import displayModel\n", "import displayModel\nimport windowUtils\n", 1)
          if "import locationHelper\n" not in current:
              old = "from locationHelper import RectLTWH\n"
              if old not in current:
                  raise RuntimeError(f"Missing locationHelper import marker in {path}")
              current = current.replace(
                  old,
                  "import locationHelper\nfrom locationHelper import RectLTRB, RectLTWH\n",
                  1,
              )
          if helper_start not in current:
              if class_marker not in current:
                  raise RuntimeError(f"Missing MenuItem marker in {path}")
              current = current.replace(class_marker, helper_block + class_marker, 1)
          if "\tdef _get_location(self) -> RectLTWH | None:" not in current:
              current = current.replace(
                  class_marker + "\n",
                  class_marker + "\n" + location_method,
                  1,
              )
          write(path, current)

          # Preserve all existing NextGen geometry tests and append only the official remap tests.
          path = "tests/unit/test_locationHelper.py"
          current = read(path)
          upstream_text = show(path)
          if "_remapRectByAnchors" not in current.split("\n", 20)[8]:
              old = "from locationHelper import Point, RectLTRB, RectLTWH\n"
              if old not in current:
                  raise RuntimeError(f"Missing import marker in {path}")
              current = current.replace(
                  old,
                  "from locationHelper import Point, RectLTRB, RectLTWH, _remapRectByAnchors\n",
                  1,
              )
          class_start = "class TestRemapRectByAnchors(unittest.TestCase):"
          if class_start not in current:
              test_block = upstream_text[upstream_text.index(class_start):].rstrip() + "\n"
              current = current.rstrip() + "\n\n\n" + test_block
          write(path, current)
          PY

          git add \
            NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/IAccessible/__init__.py \
            NVDA-2026.2-HARDENED-SOURCE-V5/source/locationHelper.py \
            NVDA-2026.2-HARDENED-SOURCE-V5/source/winBindings/user32.py \
            NVDA-2026.2-HARDENED-SOURCE-V5/source/windowUtils.py \
            NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_locationHelper.py

          git diff --cached --check
          expected=$(printf '%s\n' \
            NVDA-2026.2-HARDENED-SOURCE-V5/source/NVDAObjects/IAccessible/__init__.py \
            NVDA-2026.2-HARDENED-SOURCE-V5/source/locationHelper.py \
            NVDA-2026.2-HARDENED-SOURCE-V5/source/winBindings/user32.py \
            NVDA-2026.2-HARDENED-SOURCE-V5/source/windowUtils.py \
            NVDA-2026.2-HARDENED-SOURCE-V5/tests/unit/test_locationHelper.py | sort)
          actual=$(git diff --cached --name-only | sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected staged paths:" >&2
            git diff --cached --name-status >&2
            exit 1
          fi

          rm .github/workflows/port-20698-nextgen.yml
          git add -A
          git diff --cached --check
          git commit -m "NextGen: fix x64 Win32 menu DPI mapping (#20698)"
          git push origin HEAD:automation/port-20698-nextgen
